name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Code herunterladen
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Module installieren
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter PyPDF2 PyMuPDF pillow python-dotenv groq sentence-transformers torch transformers pydantic

    - name: App mit PyInstaller bauen
      run: |
        pyinstaller --name "LearnTut" --windowed --add-data "logo.png;." --icon="logo.png" --collect-all customtkinter --collect-all pymupdf --collect-all sentence_transformers --collect-all transformers --collect-all torch --collect-all groq --collect-all pydantic --hidden-import PIL._tkinter_finder app.py

    - name: App-Ordner hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LearnTut-Windows
        path: dist/LearnTut/

name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Code herunterladen
      uses: actions/checkout@v4

    - name: Python installieren
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Module installieren
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter PyPDF2 PyMuPDF pillow python-dotenv groq
    
    - name: EXE mit PyInstaller bauen
      run: |
        pyinstaller --name LearnTut --onefile --windowed --add-data "logo.png;." --icon=logo.png app.py

    - name: EXE hochladen
      uses: actions/upload-artifact@v4
      with:
        name: LearnTut-Windows
        path: dist/LearnTut.exe
